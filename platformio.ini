[env:esp32]
platform = espressif32
board = esp32dev
framework = espidf
board_build.partitions = partitions.csv
board_build.f_cpu = 160000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio
upload_speed = 921600
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0

# Serial Port Configuration:
# PlatformIO automatically detects the connected port.
# If multiple devices are plugged in, uncomment and specify your port:
# upload_port = COM3
# monitor_port = COM3
# Linux/macOS examples:
# upload_port = /dev/ttyUSB0
# monitor_port = /dev/ttyUSB0

# Match LwIP ARP table capacity to MAX_CLIENTS (96 entries * 24 B = ~2.3 KB RAM)
build_flags =
    -DARP_TABLE_SIZE=96
